goal: "Start and stop the Netty transport through the public server facade"
keyresults:
  - kr-1: "WaveServer.start accepts only a complete ServerSpec."
  - kr-2: "RunningServer exposes the actual bound address and explicit stop operation."
  - kr-3: "Only io.waveio.server reads the qualified io.waveio.netty transport export."
rules:
  - id: m6-02-no-netty-in-public-signatures
    name: facade-hides-netty-types
    apply: "waveio-server/src/main/java/io/waveio/server"
    level: error
    desc:
      - "Public server API signatures must not expose Netty classes."
