goal: "Establish the JDK-only execution lifecycle contract"
keyresults:
  - kr-1: "waveio-execution is a named JPMS module with no non-JDK production dependency."
  - kr-2: "The lifecycle distinguishes active, success, failure, cancellation, and deadline timeout."
  - kr-3: "Capacity rejection and cleanup failure observation have explicit public contracts."
rules:
  - id: m2-01-execution-isolation
    name: execution-module-remains-jdk-only
    apply: "waveio-execution"
    level: error
    desc:
      - "Production code has no HTTP, Netty, or third-party dependency."
      - "The module exports only io.waveio.execution."
