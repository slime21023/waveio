goal: "Close the Task, blocking, and Flow correctness gate"
keyresults:
  - kr-1: "Task completion observes parent execution timeout and cancellation."
  - kr-2: "Task continuations, CompletionStage callbacks, and blocking results re-enter managed execution."
  - kr-3: "Blocking and Flow accumulation remain explicitly bounded and cancellation-aware."
rules:
  - id: m3-06-parent-deadline
    name: task-does-not-extend-parent-deadline
    apply: "waveio-task/src/test/java/io/waveio/task/TaskTest.java"
    level: error
    desc:
      - "A Task timeout longer than its execution deadline still completes with the execution deadline failure."
