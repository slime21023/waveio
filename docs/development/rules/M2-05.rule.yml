goal: "Make execution termination deterministic, observable, and exactly once"
keyresults:
  - kr-1: "Success, failure, cancellation, and timeout use first-terminal-wins arbitration."
  - kr-2: "Terminal transition discards late callbacks and runs LIFO cleanup exactly once."
  - kr-3: "Cleanup failures are observed without replacing the selected terminal state."
rules:
  - id: m2-05-terminal-arbitration
    name: terminal-transition-is-one-way
    apply: "waveio-execution/src/main/java/io/waveio/execution/Execution.java"
    level: error
    desc:
      - "Only ACTIVE can transition to a terminal state."
      - "Cleanup is LIFO and does not alter the selected terminal state."
