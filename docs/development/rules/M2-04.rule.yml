goal: "Expose a configured managed execution runtime with ScopedValue context"
keyresults:
  - kr-1: "ExecutionConfig requires queue capacity, parallelism, and deadline."
  - kr-2: "Execution.current is available only during managed segments."
  - kr-3: "External callbacks return through ExecutionRef to the serial dispatcher."
rules:
  - id: m2-04-explicit-runtime-config
    name: runtime-has-no-unbounded-implicit-default
    apply: "waveio-execution/src/main/java/io/waveio/execution/ExecutionConfig.java"
    level: error
    desc:
      - "All capacity and deadline parameters are mandatory and positive."
