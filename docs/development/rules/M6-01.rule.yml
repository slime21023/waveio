goal: "Establish immutable and explicit public server configuration contracts"
keyresults:
  - kr-1: "The io.waveio.server JPMS module exports only the public server facade package."
  - kr-2: "Server limits and all timeouts are required and positive."
  - kr-3: "ServerSpec contains the handler, registry, address, execution config, limits, and timeouts without defaults."
rules:
  - id: m6-01-no-implicit-server-defaults
    name: server-configuration-is-explicit
    apply: "waveio-server/src/main/java"
    level: error
    desc:
      - "Public server configuration must not provide unbounded or opaque capacity and timeout defaults."
