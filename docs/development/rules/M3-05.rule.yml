goal: "Provide the minimal bounded JDK Flow bridge required by HTTP bodies"
keyresults:
  - kr-1: "Collector requests data one item at a time."
  - kr-2: "Collector copies ByteBuffer content and enforces a caller-supplied byte limit."
  - kr-3: "Overflow cancels the upstream subscription and completes exceptionally."
rules:
  - id: m3-05-bounded-flow
    name: flow-collector-has-bounded-accumulation
    apply: "waveio-task/src/main/java/io/waveio/task/ByteBufferCollector.java"
    level: error
    desc:
      - "maximumBytes is mandatory and checked before each copy."
      - "The upstream subscription is cancelled on overflow."
