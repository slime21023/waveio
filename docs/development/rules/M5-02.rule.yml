goal: "Serve the first plaintext HTTP/1.1 handler response through Netty"
keyresults:
  - kr-1: "A NIO TCP bootstrap owns acceptor, worker groups, and an execution runtime."
  - kr-2: "A Netty HTTP request becomes transport-independent HTTP metadata before reaching a Handler."
  - kr-3: "A real socket receives the committed response status from a managed handler task."
rules:
  - id: m5-02-no-public-server-facade
    name: server-facade-remains-an-m6-concern
    apply: "waveio-netty/src/main/java"
    level: error
    desc:
      - "The plaintext bootstrap remains package-private until the M6 public server facade."
