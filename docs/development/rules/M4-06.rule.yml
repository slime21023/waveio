goal: "Close the HTTP public API and Netty-isolation gate"
keyresults:
  - kr-1: "HTTP public contracts expose no Netty types."
  - kr-2: "Memory fixture covers handler, chain, router, response, and policy paths."
  - kr-3: "HEAD suppresses body consumption while retaining status and headers."
rules:
