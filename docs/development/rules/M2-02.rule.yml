goal: "Provide deterministic time and callback control for execution tests"
keyresults:
  - kr-1: "Tests advance time explicitly through ManualClock."
  - kr-2: "Callbacks are not run before their scheduled deadline."
  - kr-3: "Callbacks due at the same instant run in FIFO submission order."
rules:
  - id: m2-02-no-wall-clock
    name: deterministic-harness-does-not-sleep
    apply: "waveio-execution/src/test/java/io/waveio/execution/testing"
    level: error
    desc:
      - "Tests use ManualClock and DeterministicScheduler instead of wall-clock waiting."
