name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
          cache: maven
      - name: Verify (Unix)
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp verify
      - name: Verify (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp verify
      - name: Release API and JPMS gates
        shell: pwsh
        run: ./scripts/verify-release-gates.ps1
