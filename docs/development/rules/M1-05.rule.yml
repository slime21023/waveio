goal: "Make registry snapshots immutable and safe to overlay by scope"
keyresults:
  - kr-1: "Built registries are immutable snapshots that retain service instance identity."
  - kr-2: "The overlay argument takes precedence while the receiver remains the fallback."
  - kr-3: "Nested overlays do not modify parent or sibling registry views."
rules:
  - id: m1-05-overlay-precedence
    name: overlay-is-local-and-argument-first
    apply: "waveio-foundation/src/main/java/io/waveio/registry/Registry.java"
    level: error
    desc:
      - "overlay uses its argument as the first lookup source."
      - "No operation mutates a previously built Registry."
