goal: "Implement lazy Task composition, terminal running, timeout, and finalization"
keyresults:
  - kr-1: "map, flatMap, and recover preserve lazy Task composition."
  - kr-2: "Finalizers execute exactly once; their failure replaces success and is suppressed onto existing failure."
  - kr-3: "Task timeout returns through the managed execution without extending execution deadline."
rules:
  - id: m3-02-finalizer-contract
    name: task-finalizer-preserves-terminal-failure
    apply: "waveio-task/src/main/java/io/waveio/task/Task.java"
    level: error
    desc:
      - "Finalizer failure replaces a successful result."
      - "Finalizer failure is suppressed when the source task already failed."
