goal: "Close the execution runtime concurrency and resource-safety gate"
keyresults:
  - kr-1: "Concurrent executions preserve separate ScopedValue bindings."
  - kr-2: "One execution serializes its own callbacks even when runtime parallelism is greater than one."
  - kr-3: "Terminal cleanup runs exactly once and leaves no current execution binding on the caller thread."
rules:
  - id: m2-06-deterministic-gate
    name: execution-gate-does-not-use-sleep
    apply: "waveio-execution/src/test/java/io/waveio/execution/ExecutionRuntimeGateTest.java"
    level: error
    desc:
      - "Concurrency coordination uses latches and bounded waits, never arbitrary sleep."
