goal: "Establish the version-pinned Netty HTTP transport module"
keyresults:
  - kr-1: "The reactor contains the io.waveio.netty named JPMS module."
  - kr-2: "All direct Netty dependencies use the single pinned 4.2.17.Final version property."
  - kr-3: "The module uses transport (which contains the NIO classes in 4.2.17.Final), HTTP codec, and handler artifacts without netty-all."
rules:
  - id: m5-01-no-netty-all
    name: no-aggregate-netty-dependency
    apply: "waveio-netty/pom.xml"
    level: error
    desc:
      - "The Netty aggregate artifact netty-all must not be declared."
