goal: "Bridge CompletionStage without leaking external completion threads into Task continuations"
keyresults:
  - kr-1: "Task.fromStage accepts an existing stage that may already be active."
  - kr-2: "External completion is rescheduled through ExecutionRef before result delivery."
  - kr-3: "Task export starts a managed execution and returns a standard CompletionStage."
rules:
  - id: m3-03-stage-reentry
    name: external-stage-reenters-execution
    apply: "waveio-task/src/main/java/io/waveio/task/Task.java"
    level: error
    desc:
      - "CompletionStage callbacks call ExecutionRef before invoking the Task callback."
