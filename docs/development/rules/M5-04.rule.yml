goal: "Write committed HTTP responses with bounded Flow demand and ordered reuse"
keyresults:
  - kr-1: "Explicit empty bodies use Content-Length: 0; unknown-length publishers use chunked framing."
  - kr-2: "The outbound writer requests each next body item only after its preceding write succeeds."
  - kr-3: "A keep-alive connection resumes reads only after the complete response is flushed."
rules:
  - id: m5-04-commit-failure-closes-channel
    name: failed-response-write-is-terminal
    apply: "waveio-netty/src/main/java"
    level: error
    desc:
      - "A failed header, body, or terminal write must cancel the publisher when applicable and close the channel."
