goal: "Freeze the 0.1.0 public API boundary and compatibility policy"
keyresults:
  - kr-1: "Every consumer-facing JPMS export is recorded in the API baseline."
  - kr-2: "Netty remains inaccessible to general consumers."
  - kr-3: "The 0.x and Java 25 support policies are explicit."
rules:
  - id: m7-01-exported-api-baseline
    name: public-api-requires-baseline-update
    apply: "src/main/java/module-info.java"
    level: error
    desc:
      - "Changing an exported package requires an API compatibility baseline update."
