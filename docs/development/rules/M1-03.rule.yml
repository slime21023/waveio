goal: "Verify the wrapper build on GitHub-hosted Ubuntu and Windows"
keyresults:
  - kr-1: "The workflow runs on push, pull request, and manual dispatch."
  - kr-2: "Ubuntu and Windows use Microsoft JDK 25 and Maven cache."
  - kr-3: "The workflow has only contents: read permission and executes verify through the wrapper."
rules:
  - id: m1-03-ci-matrix
    name: ci-verifies-both-supported-host-platforms
    apply: ".github/workflows/verify.yml"
    level: error
    desc:
      - "The matrix includes ubuntu-latest and windows-latest."
      - "Each platform runs its native Maven wrapper command."
