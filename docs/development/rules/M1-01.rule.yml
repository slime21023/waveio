goal: "Create the Java 25 JPMS foundation reactor"
keyresults:
  - kr-1: "The root reactor builds waveio-foundation with io.waveio coordinates and 0.1.0-SNAPSHOT version."
  - kr-2: "io.waveio.foundation exports only io.waveio.registry."
  - kr-3: "Production compilation uses Java 25 without preview and treats all lint warnings as errors."
rules:
  - id: m1-01-foundation-module
    name: foundation-is-a-named-module
    apply: "waveio-foundation/src/main/java/module-info.java"
    level: error
    desc:
      - "The module name is io.waveio.foundation."
      - "Only io.waveio.registry is exported."
